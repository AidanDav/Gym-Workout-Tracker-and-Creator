version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: gym-tracker-db
    environment:
      POSTGRES_DB: gymtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - gym-tracker-pgdata:/var/lib/postgresql/data

volumes:
  gym-tracker-pgdata: